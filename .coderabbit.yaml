language: "en-US"
early_access: true
tone_instructions: "Alpha-stage SDK. Don't worry about backward compatibility — breaking changes are expected and welcome. Focus on correctness and clean API design."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  commit_status: true
  fail_commit_status: false
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: true
  suggested_reviewers: false
  related_issues: true
  related_prs: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"

  path_filters:
    - "!scripts/**"
    - "!assets/**"
    - "!**/*.lock"

  path_instructions:
    - path: "src/pragma_sdk/**"
      instructions: |
        Public Python SDK consumed by providers and CLI.
        Watch for:
        - Type annotation accuracy (this is the source of truth for the API contract)
        - Clean, minimal API surface (remove cruft aggressively)
        - Pydantic model validators and serialization behavior
    - path: "tests/**"
      instructions: |
        SDK tests. Verify serialization/deserialization roundtrips work correctly.
        Check that enum values match API expectations.

  tools:
    ruff:
      enabled: true
    semgrep:
      enabled: true

chat:
  auto_reply: true
  integrations:
    linear:
      usage: "auto"

knowledge_base:
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"
  linear:
    usage: "auto"
