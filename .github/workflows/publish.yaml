name: Publish SDK

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: pragmatiks-sdk v${{ steps.version.outputs.version }}
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: pragmatiks
          repositories: pragma-providers,pragma-cli,pragma-os

      - name: Trigger providers update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run update-sdk.yaml \
            --repo pragmatiks/pragma-providers \
            --field sdk_version=${{ steps.version.outputs.version }}

      - name: Trigger CLI update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run update-sdk.yaml \
            --repo pragmatiks/pragma-cli \
            --field sdk_version=${{ steps.version.outputs.version }}

      - name: Trigger OS update and runtime rebuild
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run update-sdk.yaml \
            --repo pragmatiks/pragma-os \
            --field sdk_version=${{ steps.version.outputs.version }}
