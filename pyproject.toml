[project]
name = "pragmatiks-sdk"
version = "3.0.0"
description = "Python SDK for the Pragmatiks platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28.1", "pydantic>=2.11.4", "pyyaml>=6.0", "structlog>=24.1.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
# gcp = ["pragmatiks-gcp-provider"]  # future
# aws = ["pragmatiks-aws-provider"]  # future
# azure = ["pragmatiks-azure-provider"]  # future
# all = ["pragmatiks-gcp-provider"]  # future

[dependency-groups]
dev = [
    "commitizen>=4.11.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
preview = true
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # Pyflakes
    "I",       # isort
    "PLC0415", # import-outside-top-level
    "UP",      # Pyupgrade
    "D",       # pydocstyle - docstring conventions
    "DOC",     # Ruff's docstring checks (parameters match signature)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["pragma_sdk"]

[tool.ruff.format]
preview = true

[tool.ty.environment]
python-version = "3.13"
python-platform = "darwin"

[tool.ty.src]
exclude = ["**/__pycache__/**"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "3.0.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.uv.build-backend]
module-name = "pragma_sdk"

[build-system]
requires = ["uv_build>=0.9.8"]
build-backend = "uv_build"
